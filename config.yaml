# RobotTracker configuration. Every key is optional; anything left out uses
# the built-in default. Unknown keys are rejected, so typos are caught on start.
# Calibration and the background image are NOT stored here: they are saved by
# the operator panel into setup/ (see paths.setup_dir).

maze:
  # x runs along the length, y along the width. The origin is the corner you
  # click first during calibration (top-left as seen by the camera).
  length_mm: 2438.4   # 8 ft
  width_mm: 1219.2    # 4 ft
  # Interior wall blocks as [x0, y0, x1, y1] in mm (drawn on maps only).
  walls:
    - [1219.2, 0.0, 1524.0, 304.8]
    - [1828.8, 0.0, 2133.6, 304.8]
    - [609.6, 304.8, 914.4, 609.6]
    - [304.8, 609.6, 609.6, 914.4]
    - [914.4, 609.6, 1524.0, 914.4]
    - [1828.8, 609.6, 2133.6, 1219.2]

camera:
  source: camera      # camera | file | none  (what to connect on start-up)
  index: 0            # run `robottracker cameras` to list indices
  width: 1280
  height: 720
  fps: 30
  file: ""            # used when source: file
  realtime: true      # play files at natural speed

tracker:
  mode: motion        # motion (no rover changes) | aruco (printed marker on the rover)
  rover_size_mm: 250  # rough footprint; sizes the blob filters
  diff_threshold: 35  # raise if shadows/glare are detected as the rover
  gate_mm: 300        # max jump between frames before a detection is ignored
  max_coast_s: 1.5    # how long to predict through occlusions before giving up
  # aruco_id: 0       # aruco mode: only follow this marker id
  # Parallax: the camera sees the top of the rover. Set both to correct it.
  # camera_height_mm: 2500
  # target_height_mm: 150

metrics:
  min_step_mm: 40     # movement below this is jitter (also ignores spinning in place)

scoring:
  collision_penalty_s: {1: 2, 2: 5, 3: 10}
  intervention_penalty_s: 15

server:
  port: 8000
  # operator_token: change-me   # allow operator controls from other devices
  public_video: false           # show the camera on the student dashboard

paths:
  trials_dir: trials
  setup_dir: setup
  record_video: true
